name: mac-vnc

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Facts
        run: |
          sw_vers; csrutil status
          echo "console user: $(stat -f%Su /dev/console)"
          sudo ls -l /etc/kcpassword || echo "no kcpassword"

      - name: Decode console user password
        run: |
          CU=$(stat -f%Su /dev/console)
          echo "CONSOLE_USER=$CU" >> "$GITHUB_ENV"
          sudo python3 - <<'PY' > /tmp/cpw
          k=[125,137,82,35,210,188,221,234,163,185,31]
          d=open('/etc/kcpassword','rb').read()
          print(bytes(b^k[i%11] for i,b in enumerate(d)).rstrip(b'\x00').decode('utf-8','replace'))
          PY
          sudo chmod 644 /tmp/cpw
          echo "console password: $(cat /tmp/cpw)"

      - name: ARD OFF + standalone Screen Sharing ON
        run: |
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          # CRITICAL: 26.6.1+ me ARD active hone par legacy VNC dead hota hai
          sudo "$KS" -deactivate -configure -access -off -stop || true
          sudo rm -f /Library/Preferences/com.apple.RemoteManagement.plist || true
          sudo rm -rf /var/db/RemoteManagement || true
          sudo launchctl enable system/com.apple.screensharing
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null \
            || sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true

      - name: Legacy VNC password + console attach
        run: |
          # "mac12345" ka VNCSettings XOR hash
          echo "7A55325FB99BF1D7" | sudo tee /Library/Preferences/com.apple.VNCSettings.txt >/dev/null
          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.txt
          sudo chown root:wheel /Library/Preferences/com.apple.VNCSettings.txt
          P=/Library/Preferences/com.apple.RemoteManagement
          sudo defaults write $P VNCLegacyConnectionsEnabled -bool true
          sudo defaults write $P VNCAlwaysStartOnConsole -bool true
          sudo defaults write $P LoadRemoteManagementMenuExtra -bool false || true
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true
          CU=$(stat -f%Su /dev/console)
          sudo dseditgroup -o create -q com.apple.access_screensharing || true
          sudo dseditgroup -o edit -a "$CU" -t user com.apple.access_screensharing || true

      - name: TCC grants (SIP disabled hai, isliye possible)
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          E=$(date +%s)
          for SVC in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceAccessibility; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access
              (service,client,client_type,auth_value,auth_reason,auth_version,
               indirect_object_identifier_type,flags,last_modified,last_reminded)
              VALUES('$SVC','com.apple.screensharing.agent',0,2,4,1,0,0,$E,$E);" || true
          done
          sudo sqlite3 "$DB" "SELECT service,auth_value FROM access WHERE client='com.apple.screensharing.agent';"
          sudo pkill screensharingd || true
          sleep 3

      - name: SELF TEST - real VNC login from localhost
        run: |
          cat > /tmp/probe.py <<'PY'
          import socket,struct,sys
          _IP=[58,50,42,34,26,18,10,2,60,52,44,36,28,20,12,4,62,54,46,38,30,22,14,6,64,56,48,40,32,24,16,8,57,49,41,33,25,17,9,1,59,51,43,35,27,19,11,3,61,53,45,37,29,21,13,5,63,55,47,39,31,23,15,7]
          _FP=[40,8,48,16,56,24,64,32,39,7,47,15,55,23,63,31,38,6,46,14,54,22,62,30,37,5,45,13,53,21,61,29,36,4,44,12,52,20,60,28,35,3,43,11,51,19,59,27,34,2,42,10,50,18,58,26,33,1,41,9,49,17,57,25]
          _E=[32,1,2,3,4,5,4,5,6,7,8,9,8,9,10,11,12,13,12,13,14,15,16,17,16,17,18,19,20,21,20,21,22,23,24,25,24,25,26,27,28,29,28,29,30,31,32,1]
          _P=[16,7,20,21,29,12,28,17,1,15,23,26,5,18,31,10,2,8,24,14,32,27,3,9,19,13,30,6,22,11,4,25]
          _PC1=[57,49,41,33,25,17,9,1,58,50,42,34,26,18,10,2,59,51,43,35,27,19,11,3,60,52,44,36,63,55,47,39,31,23,15,7,62,54,46,38,30,22,14,6,61,53,45,37,29,21,13,5,28,20,12,4]
          _PC2=[14,17,11,24,1,5,3,28,15,6,21,10,23,19,12,4,26,8,16,7,27,20,13,2,41,52,31,37,47,55,30,40,51,45,33,48,44,49,39,56,34,53,46,42,50,36,29,32]
          _SH=[1,1,2,2,2,2,2,2,1,2,2,2,2,2,2,1]
          _S=[[14,4,13,1,2,15,11,8,3,10,6,12,5,9,0,7,0,15,7,4,14,2,13,1,10,6,12,11,9,5,3,8,4,1,14,8,13,6,2,11,15,12,9,7,3,10,5,0,15,12,8,2,4,9,1,7,5,11,3,14,10,0,6,13],[15,1,8,14,6,11,3,4,9,7,2,13,12,0,5,10,3,13,4,7,15,2,8,14,12,0,1,10,6,9,11,5,0,14,7,11,10,4,13,1,5,8,12,6,9,3,2,15,13,8,10,1,3,15,4,2,11,6,7,12,0,5,14,9],[10,0,9,14,6,3,15,5,1,13,12,7,11,4,2,8,13,7,0,9,3,4,6,10,2,8,5,14,12,11,15,1,13,6,4,9,8,15,3,0,11,1,2,12,5,10,14,7,1,10,13,0,6,9,8,7,4,15,14,3,11,5,2,12],[7,13,14,3,0,6,9,10,1,2,8,5,11,12,4,15,13,8,11,5,6,15,0,3,4,7,2,12,1,10,14,9,10,6,9,0,12,11,7,13,15,1,3,14,5,2,8,4,3,15,0,6,10,1,13,8,9,4,5,11,12,7,2,14],[2,12,4,1,7,10,11,6,8,5,3,15,13,0,14,9,14,11,2,12,4,7,13,1,5,0,15,10,3,9,8,6,4,2,1,11,10,13,7,8,15,9,12,5,6,3,0,14,11,8,12,7,1,14,2,13,6,15,0,9,10,4,5,3],[12,1,10,15,9,2,6,8,0,13,3,4,14,7,5,11,10,15,4,2,7,12,9,5,6,1,13,14,0,11,3,8,9,14,15,5,2,8,12,3,7,0,4,10,1,13,11,6,4,3,2,12,9,5,15,10,11,14,1,7,6,0,8,13],[4,11,2,14,15,0,8,13,3,12,9,7,5,10,6,1,13,0,11,7,4,9,1,10,14,3,5,12,2,15,8,6,1,4,11,13,12,3,7,14,10,15,6,8,0,5,9,2,6,11,13,8,1,4,10,7,9,5,0,15,14,2,3,12],[13,2,8,4,6,15,11,1,10,9,3,14,5,0,12,7,1,15,13,8,10,3,7,4,12,5,6,11,0,14,9,2,7,11,4,1,9,12,14,2,0,6,10,13,15,3,5,8,2,1,14,7,4,10,8,13,15,12,9,0,3,5,6,11]]
          def bits(b,n): return [(b>>(n-1-i))&1 for i in range(n)]
          def perm(bl,t): return [bl[i-1] for i in t]
          def num(bl):
              v=0
              for b in bl: v=(v<<1)|b
              return v
          def keys(key):
              k=perm(bits(int.from_bytes(key,'big'),64),_PC1); c,d=k[:28],k[28:]; o=[]
              for s in _SH:
                  c=c[s:]+c[:s]; d=d[s:]+d[:s]; o.append(perm(c+d,_PC2))
              return o
          def des(block,key):
              ks=keys(key); x=perm(bits(int.from_bytes(block,'big'),64),_IP); l,r=x[:32],x[32:]
              for n in range(16):
                  z=[a^b for a,b in zip(perm(r,_E),ks[n])]; o=[]
                  for i in range(8):
                      ch=z[i*6:i*6+6]; o+=bits(_S[i][((ch[0]<<1)|ch[5])*16+num(ch[1:5])],4)
                  l,r=r,[a^b for a,b in zip(l,perm(o,_P))]
              return num(perm(r+l,_FP)).to_bytes(8,'big')
          def rev(b):
              r=0
              for i in range(8):
                  if b&(1<<i): r|=1<<(7-i)
              return r
          PW=b"mac12345"[:8].ljust(8,b'\x00')
          KEY=bytes(rev(b) for b in PW)
          def probe(ver):
              s=socket.create_connection(('127.0.0.1',5900),10); s.settimeout(10)
              v=s.recv(12); print("  server banner:",v.decode(errors='replace').strip())
              s.sendall(ver); n=s.recv(1)
              if not n: print("  closed"); s.close(); return None
              if n[0]==0:
                  ln=struct.unpack('>I',s.recv(4))[0]; print("  refused:",s.recv(ln).decode(errors='replace')); s.close(); return None
              t=list(s.recv(n[0])); print("  security types:",t)
              if 2 not in t: s.close(); return t
              s.sendall(bytes([2])); ch=s.recv(16)
              s.sendall(des(ch[:8],KEY)+des(ch[8:],KEY))
              res=struct.unpack('>I',s.recv(4))[0]
              print("  LEGACY VNC AUTH:", "SUCCESS ✅" if res==0 else "FAILED ❌")
              s.close(); return t
          print("=== probe as RFB 3.8 ===")
          a=probe(b'RFB 003.008\n')
          print("=== probe as RFB 3.889 (Apple) ===")
          try: probe(b'RFB 003.889\n')
          except Exception as e: print("  ",e)
          if not a or 2 not in a:
              print("\n>>> RESULT: legacy VNC (type 2) NOT offered. RealVNC/TightVNC connect nahi honge.")
          else:
              print("\n>>> RESULT: legacy VNC available. Windows/Linux viewer chalega.")
          PY
          python3 /tmp/probe.py

      - name: Tunnel + keep alive
        run: |
          cat > /tmp/tun.sh <<'EOF'
          #!/bin/bash
          while true; do
            LOG=/tmp/pinggy.log; : > "$LOG"
            ssh -p 443 -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes \
              -R0:localhost:5900 tcp@free.pinggy.io >> "$LOG" 2>&1 &
            P=$!; A=""
            for i in $(seq 1 40); do
              A=$(grep -oE 'tcp://[^ ]+' "$LOG" | head -1 | sed 's|tcp://||')
              [ -n "$A" ] && break; sleep 2
            done
            echo "=============================================="
            echo "VNC ADDRESS : ${A:-FAILED}"
            echo "VNC PASSWORD: mac12345"
            echo "console user: $(stat -f%Su /dev/console)  pw: $(cat /tmp/cpw 2>/dev/null)"
            echo "time: $(date -u)"
            echo "=============================================="
            [ -z "$A" ] && cat "$LOG"
            for m in $(seq 1 50); do
              sleep 60
              kill -0 "$P" 2>/dev/null || { echo "tunnel died ${m}m, restart"; break; }
              [ $((m % 5)) -eq 0 ] && echo "[alive ${m}m] $A"
            done
            kill "$P" 2>/dev/null; wait "$P" 2>/dev/null
          done
          EOF
          chmod +x /tmp/tun.sh; /tmp/tun.sh

name: mac-vnc

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Facts
        run: |
          sw_vers; csrutil status
          CU=$(stat -f%Su /dev/console)
          echo "console user: $CU"
          echo "CU=$CU" >> "$GITHUB_ENV"
          echo "CUID=$(id -u "$CU")" >> "$GITHUB_ENV"

      - name: Decode console password
        run: |
          sudo python3 - <<'PY' > /tmp/cpw
          k=[125,137,82,35,210,188,221,234,163,185,31]
          d=open('/etc/kcpassword','rb').read()
          print(bytes(b^k[i%11] for i,b in enumerate(d)).rstrip(b'\x00').decode('utf-8','replace'))
          PY
          sudo chmod 644 /tmp/cpw
          echo "console pass: $(cat /tmp/cpw)"

      - name: ARD OFF + Screen Sharing ON
        run: |
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KS" -deactivate -configure -access -off -stop || true
          sudo rm -f /Library/Preferences/com.apple.RemoteManagement.plist || true
          sudo rm -rf /var/db/RemoteManagement || true
          sudo launchctl enable system/com.apple.screensharing
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null \
            || sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true

      - name: VNC password (32-char hash, 400)
        run: |
          F=/Library/Preferences/com.apple.VNCSettings.txt
          sudo rm -f "$F"
          echo "7A55325FB99BF1D7FF1C39567390ADCA" | sudo tee "$F" >/dev/null
          sudo chown root:wheel "$F"; sudo chmod 400 "$F"
          P=/Library/Preferences/com.apple.RemoteManagement
          sudo defaults write $P VNCLegacyConnectionsEnabled -bool true
          sudo defaults write $P VNCAlwaysStartOnConsole -bool true
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 standby 0 || true
          sudo dseditgroup -o create -q com.apple.access_screensharing || true
          sudo dseditgroup -o edit -a "$CU" -t user com.apple.access_screensharing || true

      - name: TCC grants
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          E=$(date +%s)
          for SVC in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceAccessibility; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access
              (service,client,client_type,auth_value,auth_reason,auth_version,
               indirect_object_identifier_type,flags,last_modified,last_reminded)
              VALUES('$SVC','com.apple.screensharing.agent',0,2,4,1,0,0,$E,$E);" || true
          done
          for TGT in com.apple.systemevents com.apple.finder; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access
              (service,client,client_type,auth_value,auth_reason,auth_version,
               indirect_object_identifier_type,indirect_object_identifier,flags,last_modified,last_reminded)
              VALUES('kTCCServiceAppleEvents','/usr/bin/osascript',1,2,4,1,0,'$TGT',0,$E,$E);" || true
          done
          sudo pkill screensharingd || true
          sleep 4
          sudo lsof -i :5900 || echo "WARN 5900 down"

      - name: SPEED - animations off (as console user)
        run: |
          asu() { sudo launchctl asuser "$CUID" sudo -u "$CU" "$@"; }
          asu defaults write -g NSAutomaticWindowAnimationsEnabled -bool false || true
          asu defaults write -g NSWindowResizeTime -float 0.001 || true
          asu defaults write -g QLPanelAnimationDuration -float 0 || true
          asu defaults write -g NSScrollViewRubberbanding -bool false || true
          asu defaults write -g AppleEnableSwipeNavigateWithScrolls -bool false || true
          asu defaults write com.apple.dock launchanim -bool false || true
          asu defaults write com.apple.dock autohide-time-modifier -float 0 || true
          asu defaults write com.apple.dock autohide-delay -float 0 || true
          asu defaults write com.apple.dock expose-animation-duration -float 0.1 || true
          asu defaults write com.apple.dock mineffect -string scale || true
          asu defaults write com.apple.dock magnification -bool false || true
          asu defaults write com.apple.dock tilesize -int 36 || true
          asu defaults write com.apple.dock show-recents -bool false || true
          asu defaults write com.apple.universalaccess reduceTransparency -bool true || true
          asu defaults write com.apple.universalaccess reduceMotion -bool true || true
          asu defaults write com.apple.screensaver askForPassword -int 0 || true
          asu defaults write com.apple.finder DisableAllAnimations -bool true || true
          asu killall Dock || true
          asu killall Finder || true
          sudo mdutil -a -i off || true
          sudo defaults write /Library/Preferences/com.apple.SoftwareUpdate AutomaticCheckEnabled -bool false || true

      - name: SPEED - solid wallpaper
        run: |
          python3 - <<'PY'
          import zlib,struct
          W=H=64; c=(24,24,28)
          raw=b''.join(b'\x00'+bytes(c)*W for _ in range(H))
          def ch(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'
          png+=ch(b'IHDR',struct.pack('>IIBBBBB',W,H,8,2,0,0,0))
          png+=ch(b'IDAT',zlib.compress(raw,9))+ch(b'IEND',b'')
          open('/tmp/bg.png','wb').write(png)
          print("bg.png written")
          PY
          sudo chmod 644 /tmp/bg.png
          asu() { sudo launchctl asuser "$CUID" sudo -u "$CU" "$@"; }
          asu osascript -e 'tell application "System Events" to set picture of every desktop to "/tmp/bg.png"' || true
          asu osascript -e 'tell application "Finder" to set desktop picture to POSIX file "/tmp/bg.png"' || true

      - name: SPEED - lower resolution
        run: |
          brew install displayplacer || true
          export PATH="/opt/homebrew/bin:$PATH"
          asu() { sudo launchctl asuser "$CUID" sudo -u "$CU" "$@"; }
          asu displayplacer list || true
          ID=$(asu displayplacer list 2>/dev/null | grep -m1 'Persistent screen id' | awk '{print $NF}')
          echo "display id: $ID"
          if [ -n "$ID" ]; then
            asu displayplacer "id:$ID res:1280x720 hz:60 color_depth:8 scaling:off" || true
          fi
          asu displayplacer list | head -25 || true

      - name: Verify VNC auth
        run: |
          python3 - <<'PY'
          import socket
          s=socket.create_connection(('127.0.0.1',5900),10); s.settimeout(10)
          print("banner:",s.recv(12).decode(errors='replace').strip())
          s.sendall(b'RFB 003.008\n'); n=s.recv(1)[0]
          t=list(s.recv(n)); print("security types:",t)
          print("RESULT:", "OK - VncAuth ready" if 2 in t else "FAIL")
          s.close()
          PY

      - name: Tunnel + keep alive
        run: |
          cat > /tmp/tun.sh <<'EOF'
          #!/bin/bash
          SSHOPT="-p 443 -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o Compression=no -o Ciphers=aes128-gcm@openssh.com -o IPQoS=lowdelay -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -o TCPKeepAlive=yes"
          while true; do
            : > /tmp/tcp.log
            ssh $SSHOPT -R0:localhost:5900 tcp@free.pinggy.io >> /tmp/tcp.log 2>&1 &
            T=$!
            A=""
            for i in $(seq 1 45); do
              A=$(grep -oE 'tcp://[^ ]+' /tmp/tcp.log | head -1 | sed 's|tcp://||')
              [ -n "$A" ] && break
              sleep 2
            done
            echo "=============================================================="
            echo "TIGERVNC ADDRESS : ${A:-FAILED}"
            echo "PASSWORD         : mac12345"
            echo ""
            echo "Windows:"
            echo "vncviewer64-1.16.2.exe -AutoSelect=0 -PreferredEncoding=Tight -CustomCompressLevel=1 -CompressLevel=9 -QualityLevel=2 -FullColor=0 -LowColorLevel=1 -SecurityTypes=VncAuth -RemoteResize=0 -AlwaysCursor=1 -CursorType=Dot -PointerEventInterval=50 -AcceptClipboard=0 ${A}"
            echo ""
            echo "Linux:"
            echo "vncviewer -AutoSelect=0 -PreferredEncoding=Tight -CustomCompressLevel=1 -CompressLevel=9 -QualityLevel=2 -FullColor=0 -LowColorLevel=1 -SecurityTypes=VncAuth -RemoteResize=0 -AlwaysCursor=1 -CursorType=Dot -PointerEventInterval=50 -AcceptClipboard=0 ${A}"
            echo ""
            echo "console: $(stat -f%Su /dev/console) / $(cat /tmp/cpw 2>/dev/null)"
            echo "time UTC: $(date -u)"
            echo "=============================================================="
            cat /tmp/tcp.log
            for m in $(seq 1 50); do
              sleep 60
              kill -0 "$T" 2>/dev/null || { echo "tunnel died ${m}m, restart"; break; }
              [ $((m % 5)) -eq 0 ] && echo "[alive ${m}m] ${A}"
            done
            kill "$T" 2>/dev/null; wait "$T" 2>/dev/null
            echo "rotating tunnel..."
          done
          EOF
          chmod +x /tmp/tun.sh
          /tmp/tun.sh

name: mac-vnc

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Create admin user
        run: |
          set -x
          sudo dscl . -create /Users/macuser
          sudo dscl . -create /Users/macuser UserShell /bin/zsh
          sudo dscl . -create /Users/macuser RealName "Mac User"
          sudo dscl . -create /Users/macuser UniqueID 1001
          sudo dscl . -create /Users/macuser PrimaryGroupID 80
          sudo dscl . -create /Users/macuser NFSHomeDirectory /Users/macuser
          sudo dscl . -passwd /Users/macuser 'Mac@12345'
          sudo createhomedir -c -u macuser >/dev/null
          sudo dseditgroup -o edit -a macuser -t user admin
          sudo dseditgroup -o create -q com.apple.access_screensharing || true
          sudo dseditgroup -o edit -a macuser -t user com.apple.access_screensharing || true

      - name: Enable Screen Sharing
        run: |
          set -x
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KS" -configure -allowAccessFor -allUsers -privs -all || true
          sudo "$KS" -configure -clientopts -setvnclegacy -vnclegacy yes || true
          # legacy VNC password = mac12345
          echo "7A55325FB99BF1D7" | sudo tee /Library/Preferences/com.apple.VNCSettings.txt >/dev/null
          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.txt
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsEnabled -bool true || true
          sudo launchctl enable system/com.apple.screensharing
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true
          sudo "$KS" -activate -restart -agent -console || true
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true

      - name: Grant TCC screen capture + control
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          E=$(date +%s)
          for SVC in kTCCServiceScreenCapture kTCCServicePostEvent; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access
              (service,client,client_type,auth_value,auth_reason,auth_version,
               indirect_object_identifier_type,flags,last_modified,last_reminded)
              VALUES('$SVC','com.apple.screensharing.agent',0,2,4,1,0,0,$E,$E);" || true
          done
          sudo sqlite3 "$DB" "SELECT service,client,auth_value FROM access WHERE client='com.apple.screensharing.agent';" || true
          sudo pkill screensharingd || true
          sleep 3
          sudo lsof -i :5900 || echo "WARN: 5900 not listening"

      - name: Sanity check
        run: |
          sw_vers
          csrutil status
          echo "console user: $(stat -f%Su /dev/console)"
          echo "user=macuser  pass=Mac@12345  vncpass=mac12345"

      - name: Tunnel + keep alive
        run: |
          cat > /tmp/tun.sh <<'EOF'
          #!/bin/bash
          while true; do
            LOG=/tmp/pinggy.log
            : > "$LOG"
            ssh -p 443 -T \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=20 \
              -o ServerAliveCountMax=3 \
              -o ExitOnForwardFailure=yes \
              -R0:localhost:5900 tcp@free.pinggy.io >> "$LOG" 2>&1 &
            SSHPID=$!
            ADDR=""
            for i in $(seq 1 40); do
              ADDR=$(grep -oE '[a-z0-9-]+\.[a-z0-9.-]*pinggy[a-z.]*:[0-9]+' "$LOG" | head -1)
              [ -n "$ADDR" ] && break
              sleep 2
            done
            echo "=============================================="
            if [ -n "$ADDR" ]; then
              echo "VNC ADDRESS : $ADDR"
            else
              echo "NO ADDRESS YET - raw log:"
              cat "$LOG"
            fi
            echo "USER: macuser   PASS: Mac@12345   VNCPASS: mac12345"
            echo "time: $(date -u)"
            echo "=============================================="
            # free tunnel ~60 min; refresh at 50 min
            for m in $(seq 1 50); do
              sleep 60
              if ! kill -0 "$SSHPID" 2>/dev/null; then
                echo "tunnel died at minute $m, restarting..."
                break
              fi
              if [ $((m % 5)) -eq 0 ]; then
                echo "[alive ${m}m] VNC: ${ADDR:-unknown}"
              fi
            done
            kill "$SSHPID" 2>/dev/null
            wait "$SSHPID" 2>/dev/null
            echo "rotating tunnel..."
          done
          EOF
          chmod +x /tmp/tun.sh
          /tmp/tun.sh

name: mac-vnc

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Facts
        run: |
          sw_vers; csrutil status
          echo "console user: $(stat -f%Su /dev/console)"

      - name: Decode console password
        run: |
          sudo python3 - <<'PY' > /tmp/cpw
          k=[125,137,82,35,210,188,221,234,163,185,31]
          d=open('/etc/kcpassword','rb').read()
          print(bytes(b^k[i%11] for i,b in enumerate(d)).rstrip(b'\x00').decode('utf-8','replace'))
          PY
          sudo chmod 644 /tmp/cpw
          echo "console pass: $(cat /tmp/cpw)"

      - name: ARD OFF + Screen Sharing ON
        run: |
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KS" -deactivate -configure -access -off -stop || true
          sudo rm -f /Library/Preferences/com.apple.RemoteManagement.plist || true
          sudo rm -rf /var/db/RemoteManagement || true
          sudo launchctl enable system/com.apple.screensharing
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null \
            || sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true

      - name: VNC password (32-char hash, 400 perms)
        run: |
          F=/Library/Preferences/com.apple.VNCSettings.txt
          sudo rm -f "$F"
          echo "7A55325FB99BF1D7FF1C39567390ADCA" | sudo tee "$F" >/dev/null
          sudo chown root:wheel "$F"; sudo chmod 400 "$F"
          P=/Library/Preferences/com.apple.RemoteManagement
          sudo defaults write $P VNCLegacyConnectionsEnabled -bool true
          sudo defaults write $P VNCAlwaysStartOnConsole -bool true
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true
          CU=$(stat -f%Su /dev/console)
          sudo dseditgroup -o create -q com.apple.access_screensharing || true
          sudo dseditgroup -o edit -a "$CU" -t user com.apple.access_screensharing || true

      - name: TCC grants
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          E=$(date +%s)
          for SVC in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceAccessibility; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access
              (service,client,client_type,auth_value,auth_reason,auth_version,
               indirect_object_identifier_type,flags,last_modified,last_reminded)
              VALUES('$SVC','com.apple.screensharing.agent',0,2,4,1,0,0,$E,$E);" || true
          done
          sudo pkill screensharingd || true
          sleep 4
          sudo lsof -i :5900 || echo "WARN 5900 down"

      - name: Check VNC auth type
        run: |
          python3 - <<'PY'
          import socket
          s=socket.create_connection(('127.0.0.1',5900),10); s.settimeout(10)
          print("banner:",s.recv(12).decode(errors='replace').strip())
          s.sendall(b'RFB 003.008\n'); n=s.recv(1)[0]
          t=list(s.recv(n)); print("security types:",t)
          print("RESULT:", "OK - type 2 present" if 2 in t else "FAIL - no legacy VNC")
          s.close()
          PY

      - name: Install noVNC + websockify
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --upgrade pip
          /tmp/venv/bin/pip install -q websockify
          git clone --depth 1 https://github.com/novnc/noVNC /tmp/noVNC
          ls /tmp/noVNC/vnc.html /tmp/noVNC/vnc_lite.html
          nohup /tmp/venv/bin/websockify --web /tmp/noVNC 6080 127.0.0.1:5900 \
            > /tmp/novnc.log 2>&1 &
          sleep 6
          cat /tmp/novnc.log
          echo -n "local vnc.html status: "
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:6080/vnc.html

      - name: Tunnels + keep alive
        run: |
          cat > /tmp/tun.sh <<'EOF'
          #!/bin/bash
          SSHOPT="-p 443 -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes"
          while true; do
            : > /tmp/web.log; : > /tmp/tcp.log
            ssh $SSHOPT -R0:localhost:6080 free.pinggy.io >> /tmp/web.log 2>&1 &
            W=$!
            ssh $SSHOPT -R0:localhost:5900 tcp@free.pinggy.io >> /tmp/tcp.log 2>&1 &
            T=$!
            WEB=""; RAW=""
            for i in $(seq 1 45); do
              # pinggy.io wale promo/dashboard links ko DROP karo
              WEB=$(grep -oE 'https://[A-Za-z0-9._-]+' /tmp/web.log | grep -v 'pinggy\.io' | head -1)
              RAW=$(grep -oE 'tcp://[^ ]+' /tmp/tcp.log | head -1 | sed 's|tcp://||')
              [ -n "$WEB" ] && [ -n "$RAW" ] && break
              sleep 2
            done
            echo "=============================================================="
            echo "BROWSER LINK  (poora copy kar, ? ke baad ka hissa zaroori):"
            if [ -n "$WEB" ]; then
              echo "${WEB}/vnc.html?autoconnect=true&password=mac12345&resize=scale&reconnect=true&path=websockify"
            else
              echo "FAILED - neeche raw log dekh"
            fi
            echo ""
            echo "VNC APP ADDRESS (RealVNC / Remmina):"
            echo "${RAW:-FAILED}    password: mac12345"
            echo ""
            echo "console user: $(stat -f%Su /dev/console)  pass: $(cat /tmp/cpw 2>/dev/null)"
            echo "time (UTC): $(date -u)"
            echo "=============================================================="
            echo "--- RAW WEB LOG (yahan se manually bhi utha sakta hai) ---"
            cat /tmp/web.log
            echo "--- RAW TCP LOG ---"
            cat /tmp/tcp.log
            echo "------------------------------------------------------------"
            for m in $(seq 1 50); do
              sleep 60
              kill -0 "$W" 2>/dev/null || { echo "web tunnel died ${m}m"; break; }
              [ $((m % 5)) -eq 0 ] && echo "[alive ${m}m] ${WEB}/vnc.html?autoconnect=true&password=mac12345&resize=scale&reconnect=true&path=websockify"
            done
            kill "$W" "$T" 2>/dev/null; wait "$W" "$T" 2>/dev/null
            echo "rotating tunnels..."
          done
          EOF
          chmod +x /tmp/tun.sh
          /tmp/tun.sh
